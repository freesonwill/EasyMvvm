<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android JSBridge 示例</title>
    <style>
        body {
            background-color: #FFFFFF;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        input {
            background-color: #F7D358;
            width: 80%;
            padding: 10px;
            color: #000;
            border: none;
            border-radius: 5px;
            margin: 10px 0;
        }
        button {
            background-color: #F7D358;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin: 5px;
            font-size: 16px;
        }
        div#content {
            padding: 20px;
            background-color: #F7D358;
            color: #000;
            margin: 20px 0;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<h3>Android JSBridge 示例</h3>
<div id="content">
    <p>这是一个简单的 HTML 示例，通过 JS 调用 Android 原生功能。</p>
    <p>输入消息：</p>
    <input type="text" id="messageInput" placeholder="输入要显示的消息" value="Hello from JS!">
</div>

<button onclick="showAndroidToast()">显示 Toast</button>
<br>
<button onclick="getUidToken()">获取账号信息</button>
<div id="result" style="font-size:16px, font-color:red">
</div>
<br>
<button onclick="back()">返回</button>

<script type="text/javascript">
    // JS 函数：调用 Android 接口（通过 "Android" 对象）
    function showAndroidToast() {
        var message = document.getElementById('messageInput').value;
        if (window.AndroidNative) {
            AndroidNative.showToast(message);  // 调用 Android 的 showToast 方法
        } else {
            alert('JSBridge 未加载！请确保 WebView 已启用 JS 接口。');
        }
    }


    function getUidToken(){
         if (window.AndroidNative) {
         return new Promise((resolve, reject) => {
            AndroidNative.getUidToken("Test Input", "resolve", "reject");
            // 将 resolve 和 reject 函数绑定到 window 对象
            window.resolve = resolve;
            window.reject = reject;
        }).then(data => {
            document.getElementById("result").innerText = data;
            alert(data);
        }).catch(error => {
            document.getElementById("result").innerText = "错误: " + error;
        });
        } else {
            alert('JSBridge 未加载！');
        }
    }

    function back() {
        // 使用示例
        Hybrid.callNative('back', {}).then(function(user){
            console.log('user', user);
        }).catch(function(err){
        console.error('err', err);
        });
    }


    // 可选：监听页面加载完成，确保 Android 对象可用
    window.addEventListener('load', function() {
        console.log('页面加载完成，Android JSBridge 可用。');
    });

// 通用 H5 到原生的桥接代码
    (function(global){
  var cbId = 0;
  var callbacks = {};

  // H5 请求原生并等待回调
  function callNative(action, params) {
    return new Promise(function(resolve, reject){
      var id = 'cb_' + (++cbId);
      callbacks[id] = function(err, data){
        delete callbacks[id];
        if (err) reject(err); else resolve(data);
      };
      var payload = { action: action, params: params || {}, callbackId: id };

      // iOS WKWebView
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native) {
        window.webkit.messageHandlers.native.postMessage(payload);
        return;
      }
      // Android addJavascriptInterface
      if (window.AndroidNative && window.AndroidNative.postMessage) {
        window.AndroidNative.postMessage(JSON.stringify(payload));
        return;
      }
      // fallback: try url scheme
      var scheme = 'myapp://bridge?action=' + encodeURIComponent(action) + '&payload=' + encodeURIComponent(JSON.stringify(payload));
      var iframe = document.createElement('iframe'); iframe.style.display='none'; iframe.src = scheme; document.body.appendChild(iframe);
      setTimeout(function(){ document.body.removeChild(iframe); }, 1000);
    });
  }

  // 供原生调用：window.__nativeCallback(callbackId, err, data)
  global.__nativeCallback = function(id, err, data) {
    if (callbacks[id]) callbacks[id](err, data);
  };

  global.Hybrid = { callNative: callNative };
})(window);
</script>
</body>
</html>
