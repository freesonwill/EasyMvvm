<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帮助页面</title>
    <style>
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #1c1c1e;
            color: white;
            height: 100%;
        }
        .container {
            max-width: 414px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .status-bar {
            background-color: #1c1c1e;
            padding: 5px 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #38383a;
        }
        .content {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .footer {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #38383a;
        }
        .footer a {
            color: #8e8e93;
            text-decoration: none;
            font-size: 12px;
        }
        .footer a.active {
            color: #0a84ff;
        }
        ul {
            list-style-type: none;
            padding-left: 20px;
        }
        li {
            margin-bottom: 15px;
            position: relative;
        }
        li::before {
            content: "•";
            color: #ff3b30;
            position: absolute;
            left: -15px;
        }
        .highlight-text {
            color: #F34D41; /* 将其他文本设置为白色 */
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <span>帮助</span>
        <span>
                <span style="margin-right: 10px;">&#9711;</span>
                <span>&times;</span>
                <img src="./img/expand.png" />
        </span>
    </div>
    <div class="content">
        <ul>
            <li><span class="highlight-text">开局先发牌再下注，下注方式为:</span>"✓"后，本次下注才会生效。</li>
            <li>下注倒计时结束时，停止下注，荷官开始发牌。</li>
        </ul>
    </div>
    <div class="footer">
        <a href="#" class="active">基础规则</a>
        <a href="#">游戏规则</a>
        <a href="#">注区</a>
        <a href="#">赔率</a>
        <a href="#">路单</a>
    </div>
</div>
</body>
</html>
