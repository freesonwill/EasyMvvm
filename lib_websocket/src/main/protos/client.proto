syntax = "proto3";

package galaxy.client.proto;

import "common.proto";

import "sloth.proto";

message BaseResp {
  bool success = 1;
  int32 code = 2;
  string message = 3;
  bytes data = 4;
}

// 7-7: 登录游戏服
message LoginReq {
  int64 uid = 1;          //required 用户Id。cocos 实际范围为 int32；h5 为 int64
  string token = 2;       //required 登录token。client从大厅/商户登录获取

  string version = 3;     // client 壳版本。仅供 cocos 捕鱼判断是否为旧版本
  string base = 4;        // 热更版本。仅供 cocos 连 logon 使用，其他不要传
  string game_version = 5;// 小游戏版本。仅供 cocos 连 logon 使用，其他不要传

  int32 platform = 6;     // 账号平台 2=2n1（默认）、3=3n1
  int32 server = 7;       // serverId。游戏服有合并端口，cocos 用此字段识别进哪个服
  galaxy.common.proto.Setting setting = 8;
}

message LoginResp {
  bool success = 1;
  string message = 2;
}

// 7-10: 离开游戏（无携带消息）
message LogoutReq {
}

// 7-100: ping消息, 客户端回传数据。纯回传，server 无业务处理，无返回
message PingBackReq {
  string data = 1; // 纯文本数据
}

//7-101: 首开数据
message FirstLoadMatchReq {
  string lang = 1;      // client端语言，可不传，默认 zh-CN
  int32 provider = 2;   //供应商数据, 0-默认 1-sr  2-bg  3-fb  4-后台自定义
}

message FirstLoadMatchResp {
  repeated galaxy.common.proto.PlayTypeStatistical statistical = 1;
  repeated galaxy.common.proto.Tournament tournament = 2;
  repeated galaxy.common.proto.Match match = 3;
}

// 500-1000: 获取赛事统计
message StatisticalReq {
}

message StatisticalResp {
  repeated galaxy.common.proto.PlayTypeStatistical statistical = 1;
}

// 500-1001: 获取联赛信息
message ListTournamentReq {
  int32 sport_id = 1;     //required 球类id
  int32 play_type = 2;    //required 玩法类型, 0-全部 1-滚球 2-今日 3-早盘 4-冠军
  int64 start_time = 3;   //开始时间，13 位时间戳，按赛事开赛时间范围查询
  int64 end_time = 4;     //结束时间，13 位时间戳，按赛事开赛时间范围查询
  int32 size = 5;     //查询数量 0为查询所有
}

message ListTournamentResp {
  repeated galaxy.common.proto.Tournament tournament = 1;
}

// 500-1002: 获取比赛列表，盘口信息只返回热门盘口
message ListMatchReq {
  int32 sport_id = 1;     //required 球类id
  int32 play_type = 2;    //required 玩法类型, 0-全部 1-滚球 2-今日 3-早盘 4-冠军
  repeated int32 tournament_id = 3;//联赛id
  int64 start_time = 4;   //开始时间,13 位时间戳
  int64 end_time = 5;     //结束时间,13 位时间戳
  int64 cursor_match_id = 6;         // 比赛id游标
  int64 cursor_match_start_time = 7; // 比赛开始时间游标
  int32 size = 8;         // 每页显示数量,最大50
  bool reverse = 9; //true-上页，false-下页
  int32 sort_type = 10; //排序类型 0-按时间排序 1-按热门排序
}

message ListMatchResp {
  repeated galaxy.common.proto.Match match = 1;
}

message SimpleOutrightMatch {
  int64 match_id = 1; //冠军赛id
  int32 tournament_id = 2;        //联赛名称
  string tournament_name = 3;        //联赛名称
  string tournament_icon = 4;        //联赛icon url
  int32 sport_id = 5;     //球类id
  bool hot = 6;           //是否热门
  int32 weight = 7;       //权重
  string season = 8;      //赛季
}

// 500-1003: 获取比赛详情
message GetMatchReq {
  int64 match_id = 1; //required 比赛id
}

message GetMatchResp {
  galaxy.common.proto.Match match = 1;
}

// 500-1004: 获取球类信息
message ListSportReq {

}

message ListSportResp {
  repeated galaxy.common.proto.Sport sport = 1;
}

// 500-1005: 查询余额
message BalanceReq {
  string currency = 1; // 币种
}

message BalanceResp {
  string balance = 1; //余额
  string currency = 2; //币种
}

// 500-1006: 查询联赛比赛
message TournamentMatchReq {
  int32 tournament_id = 1;//required 联赛id
  int64 cursor_match_id = 2;         // 比赛id游标
  int64 cursor_match_start_time = 3; // 比赛开始时间游标
  int32 size = 4;         // 每页显示数量,最大50
  bool include_home_market = 5;//包含热门盘口
}

message TournamentMatchResp {
  repeated galaxy.common.proto.Match match = 1;
  string tournament_name = 2;
  string tournament_short_name = 3;
  string icon = 4;
  string color = 5; //配色
}

// 500-10061: 热门直播间
message HotLiveReq {
  int32 page = 1;         //请求的页数,从1开始
  int32 size = 2;         //每页显示数量,最大50
}

message HotLiveResp {
  repeated galaxy.common.proto.MatchBasicInfo match = 1;//比赛信息
  int32 total = 2;//比赛数量
}

// 500-1007: 盘口分类
message MarketCategoryReq {
  int64 match_id = 1; //required 比赛id
}

message MarketCategoryResp {
  repeated galaxy.common.proto.MarketCategory market_category = 1;
}

// 500-1008: 获取首页冠军赛列表
message ListOutrightMatchReq {
  int32 sport_id = 1;
}

message ListOutrightMatchResp {
  repeated SimpleOutrightMatch outright_match = 1;
}


message RecentLiveRoomItem {
  int64 match_id = 1; // 直播间ID（使用比赛ID）
  string name = 2;    // 展示名：主队-客队
}

message RecentLiveRoomsResp {
  repeated RecentLiveRoomItem rooms = 1;
}

message MatchInfoSignReq {
  int64 match_id = 1; //required 比赛id
}

message MatchInfoSignResp {
  string text = 1; // 格式：#体育项目,对阵队伍,比分,当前阶段
  string sign = 2; // 签名
  int64 match_id = 3; // 比赛ID
}

message VerifySignReq {
  string text = 1; // 原始字符串
  string sign = 2; // 被校验的签名
}

message VerifySignResp {
  bool success = 1; // true 表示签名一致
}

// 500-1009: 获取近31日比赛日程count
message Recently31MatchScheduleCountReq {
  int32 sport_id = 1;     //required 球类id
  int32 play_type = 2;    //required 玩法类型, 0-全部 1-滚球 2-今日 3-早盘 4-冠军
  int32 tournament_id = 3;//联赛id
  int32 time_zone = 4;    //时区，例如上海时间+8就传8, utc时间传0
}

message Recently31MatchScheduleCountResp {
  repeated galaxy.common.proto.DailyMatchCount daily_count = 1;
}

// 500-1015: 单关下注
message SingleBetReq {
  int64 match_id = 1;     //required 比赛id
  int64 selection_id = 2; //required 选项id
  string odds = 3;        //required 赔率
  string bet_amount = 4;  //required 投注
  int32 odds_change = 5;  //required 接受赔率变化类型,0:不接受赔率变动 1:接受最优赔率变动 2:接受任意赔率变动
  string currency = 6; //币种
}

message SingleBetResp {
  bool success = 1;
  string message = 3;  // 例如："Bet placed successfully."
  string order_id = 4;
}

// 500-1010: 多关下注
message MultipleBetReq {
  repeated galaxy.common.proto.BetOption bet = 1;     // 投注项
  repeated galaxy.common.proto.BetCombo combo = 2;    // 串关方式
  string currency = 3; //币种
}

message MultipleBetResp {
  bool success = 1;
  string message = 3;  // 例如："Bet placed successfully."
  repeated PlaceBetInfo place_bet_info = 4;
}

message PlaceBetInfo {
  string order_id = 1;
  int32 serial_value = 2;     // 串关选项个数, 如：投注4场比赛的3串1，此字段为3，如果是全串关（4串11*11)，此字段为0
}

// 500-1011: 发起提前结算
message EarlySettleReq {
  string bet_id = 1;          //required 注单id
  string expect_price = 3;    //required 期望提前结算单位价格
  bool accept_price_reduce = 4;   //required false:不接受价格变低 true:接受价格变低下注
}

message EarlySettleResp {
  bool success = 1;
  string message = 2;  // 例如："Bet placed successfully."
}

// 500-1012: 获取用户下注记录列表
message GetOrderPageReq {
  int32 status = 1;       //required 1未结算，2已结算，3未结算(不含确认中)
  int64 start_time = 2;   //开始时间,13位时间戳
  int64 end_time = 3;     //结束时间,13位时间戳
  int64 cursor_bet_time = 4; // 下注时间游标
  int32 size = 5;    //required 每页大小
  repeated int32 sport_id = 6;     // 球类id
  int64 match_id = 7; // 比赛id
  int32 offset_hours = 8;    //时区偏移量，例如上海时间+8就传8, utc时间传0
}

message GetOrderPageResp {
  repeated galaxy.common.proto.Order order = 1; // 下注记录
  repeated galaxy.common.proto.OrderDayCount orderDayCount = 2; // 注单每日统计
}

// 500-10121: 获取用户下注
message GetOrderReq {
  string bet_id = 1;        //下注id
}

message GetOrderResp {
  galaxy.common.proto.Order order = 1; // 下注记录
}

//500-1013: 获取单关下注限额
message GetSingleRiskReq {
  repeated galaxy.common.proto.SelectionBase selection = 1; // 选项
}

message GetSingleRiskResp {
  repeated galaxy.common.proto.RiskSingleBet risk = 1;    //限额
}

//500-1014: 获取窜关下注限额
message GetComboRiskReq {
  repeated galaxy.common.proto.SelectionBase selection = 1; // 选项
}

message GetComboRiskResp {
  repeated galaxy.common.proto.RiskComboBet risk = 1;     //限额
}

// 500-1016: 提前结算报价
message EarlySettlePriceReq {
  repeated string bet_id = 1;          //required 注单id
}

message EarlySettlePriceResp {
  repeated galaxy.common.proto.EarlySettlePrice price = 1;
}


// 500-1020: 预约下注
message ReserveBetReq {
  galaxy.common.proto.BetOption bet = 1;  // 投注项
  string bet_amount = 2;  //required  每笔下注金额
  string currency = 3; //币种
}

message ReserveBetResp {
  bool success = 1;
  string message = 2;
}

// 500-1021: 获取用户预约下注记录列表
message GetReserveOrderReq {
  int64 start_time = 1; //开始时间,13位时间戳
  int64 end_time = 2;   //结束时间,13位时间戳
  repeated int32 sport_id = 3;     // 球类id
  int64 match_id = 4; // 比赛id
  int64 cursor_bet_time = 5; // 下注时间游标
  int32 size = 6;    //required 每页大小
}

message GetReserveOrderResp {
  repeated galaxy.common.proto.ReserveOrder order = 1; // 预约记录
}


// 500-1022: 取消预约下注
message ReserveCancelReq {
  string reserve_id = 1; //required 预约id
}

message ReserveCancelResp {
  bool success = 1;
  string message = 2;
}

// 500-1023: 修改预约下注订单
message ReserveUpdateReq {
  string reserve_id = 1;//required 预约id
  string amount = 2;     //required 新的本金
  string odds = 3;      //required 新的预约赔率
}

message ReserveUpdateResp {
  bool success = 1;
  string message = 2;
}


// 500-1030: 搜索
message SearchReq {
  string word = 1;    //required 搜索词
  int32 type = 2;     //required 1-普通词  2-热门词  10-球员id  11-球队id  12-联赛id
  int64 start_time = 3;   //开始时间
  int64 end_time = 4;     //结束时间
  int32 page = 5;         //请求的页数,从1开始
  int32 size = 6;         //每页显示数量,最大50
  int32 time_zone = 7;    //时区，例如上海时间+8就传8, utc时间传0
  bool disable_match_data = 8; //是否返回比赛数据, false-返回 true-不返回
}

message SearchResp {
  int32 type = 1;     //0-无结果  1-结果列表  2-精准匹配球员  3-精准匹配球队 4-精准匹配联赛
  galaxy.common.proto.SearchDataList data_list = 2;   //结果列表
  galaxy.common.proto.SearchPlayer player = 3;              //结果球员
  galaxy.common.proto.SearchTeam team = 4;                  //结果球队
  galaxy.common.proto.Tournament tournament = 5;      //结果联赛
  repeated galaxy.common.proto.Match matches = 6;     //比赛信息， 不含盘口数据
  int32 match_total = 7;                              //比赛数量
  repeated galaxy.common.proto.DailyMatchCount daily_count = 8;    //每日比赛数量
  string correct = 9;       //正确词
}

//500-1033: 比赛搜索
message SearchMatchReq {
  int32 team_id = 1;
  int32 tournament_id = 2;
  int64 start_time = 3;   //开始时间
  int64 end_time = 4;     //结束时间
  int32 page = 5;         //请求的页数,从1开始
  int32 size = 6;         //每页显示数量,最大50
}

message SearchMatchResp {
  repeated galaxy.common.proto.Match matches = 1;     //比赛信息， 不含盘口数据
  int32 match_total = 2;                              //比赛数量
}


// 500-1031: 热门搜索词
message SearchHotWordReq {
}

message SearchHotWordResp {
  repeated string word = 2;    //热门搜索词
}

// 500-1032: 搜索自动补充词汇
message SearchRecommendReq {
  string word = 1; //required 搜索词
}

message SearchRecommendResp {
  repeated string recommend = 1; //推荐词
}


// 500-1040: 添加收藏
message AddCollectReq {
  repeated int64 match_id = 1; //required 比赛id
}

message AddCollectResp {
  bool success = 1;
  string message = 2;
}

// 500-1041: 移除收藏
message RemoveCollectReq {
  repeated int64 match_id = 1; //required 比赛id
}

message RemoveCollectResp {
  bool success = 1;
  string message = 2;
}

// 500-1042: 收藏列表
message ListCollectReq {
  int64 cursor_match_id = 1;         // 比赛id游标
  int64 cursor_match_start_time = 2; // 比赛开始时间游标
  int32 size = 3;         // 每页显示数量,最大50
  bool reverse = 4; //true-上页，false-下页
}

message ListCollectResp {
  repeated galaxy.common.proto.Match match = 1; //比赛
  int32 total = 2;
}


// 500-1051: 修改系统设置
message UpdateSettingReq {
  galaxy.common.proto.Setting setting = 1; //
}

message UpdateSettingResp {
  bool success = 1;
}

// 500-1100: 订阅首页比赛
message SubscribeHomeMatchReq {
  repeated int64 match_id = 1; //required 比赛id
}

message SubscribeHomeMatchResp {
  repeated MatchNotify match_notify = 3;
}

// 600-1000: 比赛推送
message MatchNotify {
  int64 match_id = 1;         //比赛id
  MatchBasicUpdate basic_update = 2;
  repeated galaxy.common.proto.Market market_update = 3; //只推送有变化的盘口
  bool active = 5; //比赛是否可用
}

// 500-1101: 取消订阅首页比赛
message CancelSubscribeHomeMatchReq {
  repeated int64 match_id = 1; //required 比赛id
}

message CancelSubscribeHomeMatchResp {
}

// 500-1102: 订阅比赛详情
message SubscribeMatchInfoReq {
  int64 match_id = 1; //required 比赛id
}

message SubscribeMatchInfoResp {
  MatchInfoNotify match_notify = 3;
}

// 600-1004: 比赛info推送
message MatchInfoNotify {
  int64 match_id = 1;         //比赛id
  MatchBasicUpdate basic_update = 2;
  repeated galaxy.common.proto.Market market_update = 3; //只推送有变化的盘口
}

// 500-1103: 取消订阅比赛详情
message CancelSubscribeMatchInfoReq {
  int64 match_id = 1; //required 比赛id
}

message CancelSubscribeMatchInfoResp {
}

// 500-1104: 订阅比赛盘口
message SubscribeMatchMarketReq {
  repeated MarketIdBase market = 1; //required 比赛盘口
}

message SubscribeMatchMarketResp {
  repeated MatchMarketNotify match_notify = 1;
}
// 500-1106: 获取用户消息列表
message GetSystemMsgReq {
  int32 id = 1; //消息ID，每页最小的一条
  int32 size = 2; //每页展示的数量
  int32 type = 3; //消息类型 0.全部 1.系统通知  2.活动通知
  int32 status = 4; //默认0查询全部 1未读 2已读
}
message GetSystemMsgResp {
  repeated galaxy.common.proto.MsgRecord msg_record = 1; // 消息记录
}
// 500-1107: 修改消息状态 已读或删除
message SystemMsgStatusReq {
  int32 id = 1; //消息ID
  int32 status = 3; // 1未读 2已读 3删除

}
message SystemMsgStatusResp {
  bool success = 1;
}
// 500-1108: 获取消息统计数据
message GetSystemMsgCountReq {

}
message GetSystemMsgCountResp {
  repeated galaxy.common.proto.MsgCount msgCount = 1; // 消息统计
}
// 500-1109: 获取用户消息详情
message GetSystemMsgDetailReq {
  int32 id = 1; //消息ID

}
message GetSystemMsgDetailResp {
  galaxy.common.proto.MsgRecord msgRecord = 1; // 消息记录
}
// 600-1005: 比赛盘口推送
message MatchMarketNotify {
  int64 match_id = 1;         //比赛id
  MatchBasicUpdate basic_update = 2;
  repeated galaxy.common.proto.Market market_update = 3; //只推送有变化的盘口
  galaxy.common.proto.MatchBasicInfo  matchBasicInfo = 4; // 只在订阅时返回
}

// 500-1105: 取消订阅比赛盘口
message CancelSubscribeMatchMarketReq {
  repeated MarketIdBase market = 1; //required 比赛盘口
}

message CancelSubscribeMatchMarketResp {
}

//选项
message MarketIdBase {
  int64 match_id = 1;    //比赛id
  repeated int64 market_id = 2;   //盘口id
}

// 比赛基本信息
message MatchBasicUpdate {
  int32 status = 1;           //比赛状态 0-已结束 1-推迟 2-中断 3-取消 4-未开赛 5-进行中 6-延迟 7-废弃 8-暂停
  bool bet_stop = 2;          // false: 未停止投注, true: 已停止投注
  galaxy.common.proto.MatchLiveInfo live_info = 3;  //比赛实时信息
  int64 start_time = 4;       //开始时间,13位时间戳
  int32 provider = 5;         //供应商 1-sr  2-bg  3-fb  4-后台自定义
}

//600-1001: 订单状态推送
message OrderStatusNotify {
  repeated string match_name = 1;
  repeated OrderStatus order_status = 2;
}
//订单状态
message OrderStatus {
  string order_id = 1;
  int32 combo_k = 2;         //串关k 4串11*11 为4
  int32 combo_v = 3;         //串关v 4串11*11 为11
  int32 combo_count = 4;     //串关组合数量 4串11*11 为11
  int32 status = 5;          //2-拒单 4-接单成功
  repeated galaxy.common.proto.OrderSelection selections = 6; //选项
}

//600-10011: 订单变更推送
message OrderUpdateNotify {
  galaxy.common.proto.Order order = 1;
}

//600-1002: 余额推送
message BalanceNotify {
  string balance = 1; //余额
}

//600-1003: 预约单状态推送
message ReserveStatusNotify {
  string reserve_id = 1;
  int32 status = 2;   //状态 1 - 预约成功  2 - 预约失败
}

//600-1010: 异常推送
message AberrantNotify {
  int32 code = 1;   //状态 1:挤号，2:token失效, 3:系统维护
}

//600-1011: app内通知
message AppNoticeNotify {
  int32 type = 1;     //1-进球通知
  int32 sport_id = 2;    //球类
  int64 match_id = 3; //比赛id
  string title = 4;
  string content = 5;
}

//600-1012:  提前结算推送
message EarlySettleNotify {
  galaxy.common.proto.Order order = 1; // 下注记录
}

//600-1013: 消息通知
message SystemMsgNotify {
  int32 type = 1; //类型 1系统通知 2活动通知
  int32 id = 2;  //消息id
  string title = 3; //消息标题
  string content = 4;  //消息内容
  int64 create_time = 5;  //消息创建时间
}
//600-1024: 赛事推广
message MatchPromotionMessage {
  int32 id = 1;  //消息id
  int32 status = 2; //状态
  int32 tournament_id = 3;   //联赛id
  int32 weight = 4;   //权重
  int32 displayArea = 5;   //显示区域
  string language = 6;   //语言
  string picUrl = 7;   //广告图地址
  int64 create_time = 8;  //消息创建时间
}
//600-1014: 进球通知
message GoalNotify {
  int32 sport_id = 1;   //球类
  int64 match_id = 2;   //比赛id
  string home_team = 3;     //主队名称
  int32 home_team_id = 4;   //主队id
  string home_team_icon = 5;//主队icon
  int32 home_team_score = 6;//主队得分
  string away_team = 7;     //客队名称
  int32 away_team_id = 8;   //客队id
  string away_team_icon = 9;  //客队icon
  int32 away_team_score = 10;  //客队得分
  int32 clock = 11;   //走表
}

//700-2001: 比赛统计数据
message MatchLiveReq {
  int64 match_id = 1; //required 比赛id
}
message MatchLiveResp {
  MatchLiveData match_live_data = 1;
}

//700-2002: 比赛阵容数据
message MatchLineupReq {
  int64 match_id = 1; //required 比赛id
}
message MatchLineupResp {
  MatchLineupDetail match_lineup_detail = 1;
}

//700-2003: 赛事积分榜数据
message CompetitionTableReq {
  int32 comp_id = 1; //required 赛事id
}
message CompetitionTableResp {
  CompetitionTables competition_tables = 1;
}

//700-2004: 比赛趋势数据
message MatchTrendReq {
  int64 match_id = 1; //required 比赛id
}
message MatchTrendResp {
  MatchTrendData match_trend_data = 1;
}

//700-1100: 比赛统计数据推送
message SubscribeMatchLiveReq {
  int64 match_id = 1; //required 比赛id  -1：取消订阅
}
message SubscribeMatchLiveResp {
  MatchLiveData match_live_data = 1;
}

//700-2005: 比赛直播流
message MatchLiveStreamReq {
  int64 match_id = 1; //required 比赛id
}
message MatchLiveStreamResp {
  int64 match_id = 1; //required 比赛id
  repeated MatchLiveStream streams = 2; //视频流列表
}
//700-2007: 对阵图
message SeasonBracketReq {
  int32 season_id = 1; //赛季Id
  int32 type = 2; // 1:常规对阵图(图) 2:非常规对阵图(列表)
}
message SeasonBracketResp {
  repeated SeasonBracketGroup groups = 1;       // 对阵图分组
  repeated SeasonBracketRound rounds = 2;       // 对阵阶段
  repeated SeasonBracketBracket brackets = 3;   // 对阵图
  repeated SeasonBracketMatchUp match_ups = 4;  // 对阵
}

//800-1001: 反馈标签列表
message FeedbackLabelListReq {

}

message FeedbackLabelListResp {
  repeated galaxy.common.proto.FeedbackLabel feedback_label = 1; //反馈标签
}

//800-1002: 添加反馈内容
message FeedbackContentAddReq {
  repeated int32 feedback_type_code = 1;
  string content = 2;
}

message FeedbackContentAddResp {

}





