tasks.register('checkDuplicateColorNames') {
    doLast {
        // 使用 Map<colorName, List<moduleName>> 来存储所有颜色及其所在模块
        def colorMap = [:]
        def duplicatesFound = false

        println "\n开始检查项目中重复的 color 名称..."

        // 遍历所有子项目
        subprojects { subproject ->
            def resDir = new File(subproject.projectDir, "src/main/res")
            if (resDir.exists()) {
                def colorFile = new File(resDir, "values/colors.xml")
                if (colorFile.exists()) {
                    try {
                        def xml = new XmlParser().parse(colorFile)
                        xml.children().each { node ->
                            if (node.name().toString().equals('color')) {
                                def name = node.@name
                                if (!colorMap.containsKey(name)) {
                                    colorMap[name] = []
                                }
                                colorMap[name] << subproject.name
                            }
                        }
                    } catch (Exception e) {
                        println "解析 ${subproject.name} 的 colors.xml 文件时出错: ${e.message}"
                    }
                }
            }
        }

        // 打印所有重复的 color 名称
        colorMap.each { colorName, modules ->
            if (modules.size() > 1) {
                duplicatesFound = true
                println "\n发现重复的 color 名称: '$colorName'"
                println "存在于以下模块:"
                modules.each { module ->
                    println " - $module"
                }
            }
        }

        if (duplicatesFound) {
            println "\n警告: 项目中存在 ${colorMap.count { it.value.size() > 1 }} 个重复的 color 名称!"
            throw new GradleException("发现重复的 color 名称，请解决上述冲突后再继续构建。")
        } else {
            println "\n检查完成: 未发现重复的 color 名称。"
        }
    }
}